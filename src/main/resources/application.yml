# VibeTalk API - Common Configuration
spring:
  application:
    name: vibetalk-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA common config
  jpa:
    open-in-view: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true

  jackson:
    serialization:
      fail-on-empty-beans: false
    default-property-inclusion: non_null

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # File upload
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true

  # Email (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false

  # Async
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 100
      thread-name-prefix: async-task-

# App info
app:
  name: VibeTalk

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: VibeTalk API
    description: Real-time Chat Application API
    version: 1.0.0
    contact:
      name: Development Team
      email: support@vibetalk.com