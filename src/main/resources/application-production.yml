# VibeTalk API - Production Profile
# Secrets doc tu environment variables -> khong push len Git
server:
  port: 8080

spring:
  # Database (Aiven MySQL)
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # Mail
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  # Redis (container noi bo Docker)
  data:
    redis:
      host: redis
      port: 6379
      password:
      timeout: 5000ms
      connect-timeout: 3000ms
      lettuce:
        shutdown-timeout: 200ms
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

# JWT
jwt:
  secret: ${JWT_SECRET}

# Cloudinary
cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

# App URL
app:
  url: ${APP_URL:https://vibetalk-web.vercel.app}

# Swagger - tat o production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Logging
logging:
  level:
    com.gnxrt.vibetalkapi: INFO
    org.springframework.mail: ERROR
    org.springframework.security: WARN